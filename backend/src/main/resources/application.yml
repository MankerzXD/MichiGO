server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: michigo-backend

  # Base de datos H2 en memoria para desarrollo ultra ágil
  datasource:
    url: jdbc:h2:mem:michigodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Configuración para subida de imágenes de gatos de alta resolución
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

# Integración con Google Gemini AI
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    baseUrl: https://generativelanguage.googleapis.com/v1beta/models
