<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0E131F" stroke="url(#cyberGlow)" stroke-width="4" filter="url(#glow)"/>

  <!-- Cat Ears -->
  <polygon points="26,38 20,16 42,28" fill="url(#bgGrad)"/>
  <polygon points="74,38 80,16 58,28" fill="url(#bgGrad)"/>
  
  <!-- Ear Inner -->
  <polygon points="28,34 25,22 38,28" fill="#FFCCD5"/>
  <polygon points="72,34 75,22 62,28" fill="#FFCCD5"/>

  <!-- Cat Head -->
  <circle cx="50" cy="54" r="28" fill="#1E293B"/>

  <!-- Eyes (Glowing Cyan) -->
  <ellipse cx="40" cy="48" rx="5" ry="7" fill="#06B6D4" filter="url(#glow)"/>
  <ellipse cx="60" cy="48" rx="5" ry="7" fill="#06B6D4" filter="url(#glow)"/>
  <ellipse cx="41" cy="46" rx="2" ry="3" fill="#FFFFFF"/>
  <ellipse cx="61" cy="46" rx="2" ry="3" fill="#FFFFFF"/>

  <!-- Nose -->
  <polygon points="50,56 46,52 54,52" fill="#F472B6"/>

  <!-- Mouth -->
  <path d="M 46,57 Q 50,61 50,58 Q 50,61 54,57" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="28" y1="52" x2="14" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="56" x2="14" y2="58" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="52" x2="86" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="56" x2="86" y2="58" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Collar Pokéball Gem -->
  <circle cx="50" cy="80" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 43,80 L 57,80" stroke="#1E293B" stroke-width="2"/>
  <circle cx="50" cy="80" r="2.5" fill="#FFFFFF"/>
</svg>
