<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Pin Body -->
  <path d="M 24,2 C 11.85,2 2,11.85 2,24 C 2,38 24,62 24,62 C 24,62 46,38 46,24 C 46,11.85 36.15,2 24,2 Z" 
        fill="url(#pinGrad)" filter="url(#pinShadow)" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Inner Circle with Cat Silhouette -->
  <circle cx="24" cy="22" r="14" fill="#0F172A"/>

  <!-- Cat ears inside pin -->
  <polygon points="16,18 14,10 20,14" fill="#F472B6"/>
  <polygon points="32,18 34,10 28,14" fill="#F472B6"/>
  
  <!-- Cat face -->
  <circle cx="24" cy="22" r="8" fill="#F8FAFC"/>
  <!-- Eyes -->
  <circle cx="21" cy="21" r="1.5" fill="#0F172A"/>
  <circle cx="27" cy="21" r="1.5" fill="#0F172A"/>
  <!-- Nose -->
  <polygon points="24,23.5 22.5,22 25.5,22" fill="#EC4899"/>
</svg>
